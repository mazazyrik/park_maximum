upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name parkmaximum.ru www.parkmaximum.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name parkmaximum.ru www.parkmaximum.ru;

    ssl_certificate /etc/letsencrypt/live/parkmaximum.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parkmaximum.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    include /etc/nginx/includes/app.conf;
}
